<text x="746.0" y="116.0" class="tm" font-size="11" text-anchor="end">35% dropped</text>
<circle cx="288.1" cy="112.0" r="4.5" class="c-coach ring" stroke-width="2"/>
<line x1="284.0" x2="432.7" y1="132.0" y2="132.0" class="conn" stroke-width="2"/>
<text x="200.0" y="136.0" class="t1" font-size="12" text-anchor="end" font-weight="600">GPT-6 Luna</text>
<circle cx="432.7" cy="132.0" r="4.5" class="c-learned ring" stroke-width="2"/>
<text x="746.0" y="136.0" class="tm" font-size="11" text-anchor="end">23% dropped</text>
<circle cx="284.0" cy="132.0" r="4.5" class="c-coach ring" stroke-width="2"/>
<line x1="279.9" x2="391.9" y1="152.0" y2="152.0" class="conn" stroke-width="2"/>
<text x="200.0" y="156.0" class="t1" font-size="12" text-anchor="end" font-weight="600">Haiku 4.5</text>
