<circle cx="279.9" cy="152.0" r="4.5" class="c-coach ring" stroke-width="2"/>
<line x1="291.8" x2="301.3" y1="172.0" y2="172.0" class="conn" stroke-width="2"/>
<text x="200.0" y="176.0" class="t1" font-size="12" text-anchor="end" font-weight="600">Jev</text>
<circle cx="301.3" cy="172.0" r="4.5" class="c-learned ring" stroke-width="2"/>
<text x="746.0" y="176.0" class="tm" font-size="11" text-anchor="end">7% dropped</text>
<circle cx="291.8" cy="172.0" r="4.5" class="c-coach ring" stroke-width="2"/>
