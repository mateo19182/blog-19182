<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" role="img" aria-label="Win rate during RL">
<title>Win rate during RL</title>
<style>text{font-family:Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;font-variant-numeric:tabular-nums}.bg{fill:None}.ring{stroke:#0c0c0c}.t1{fill:#f5f5f5}.t2{fill:#c8c8c8}.tm{fill:#8a8a8a}.grid{stroke:#232323}.axis{stroke:#4a4a4a}.band{fill:#b0b0b0;fill-opacity:.12}.conn{stroke:#3a3a3a}.c-learned{fill:#3987e5;stroke:#3987e5}.c-coach{fill:#d95926;stroke:#d95926}.c-written{fill:#199e70;stroke:#199e70}.c-llm{fill:#c98500;stroke:#c98500}.c-jev{fill:#d55181;stroke:#d55181}.c-ref{fill:#898781;stroke:#898781}.ci{fill:none;stroke-width:2;stroke-linecap:round}.hollow{fill-opacity:0}</style>
<text x="16.0" y="26.0" class="t1" font-size="15" text-anchor="start" font-weight="600">Teaching Faynt's Yoshi with RL, in the simulator</text>
<text x="16.0" y="45.0" class="t2" font-size="12" text-anchor="start">Share of 48 games won against each opponent, checked every 50 steps. No input delay.</text>
<line x1="16" x2="32" y1="64" y2="64" class="ci c-learned" stroke-width="2.5"/>
<text x="38.0" y="68.0" class="t2" font-size="11.5" text-anchor="start">Phillip's anti-Yoshi Fox</text>
<line x1="197.2" x2="213.2" y1="64" y2="64" class="ci c-coach" stroke-width="2.5"/>
<text x="219.2" y="68.0" class="t2" font-size="11.5" text-anchor="start">Phillip's anti-Yoshi Marth</text>
<line x1="391.0" x2="407.0" y1="64" y2="64" class="ci c-written" stroke-width="2.5"/>
<text x="413.0" y="68.0" class="t2" font-size="11.5" text-anchor="start">Phillip's Yoshi</text>
<line x1="515.5" x2="531.5" y1="64" y2="64" class="ci c-llm" stroke-width="2.5"/>
<text x="537.5" y="68.0" class="t2" font-size="11.5" text-anchor="start">Faynt's Yoshi (the starting model)</text>
<line x1="56" x2="570" y1="330.0" y2="330.0" class="grid" stroke-width="1"/>
<text x="48.0" y="334.0" class="tm" font-size="11" text-anchor="end">0%</text>
<line x1="56" x2="570" y1="270.5" y2="270.5" class="grid" stroke-width="1"/>
<text x="48.0" y="274.5" class="tm" font-size="11" text-anchor="end">25%</text>
<line x1="56" x2="570" y1="211.0" y2="211.0" class="grid" stroke-width="1"/>
<text x="48.0" y="215.0" class="tm" font-size="11" text-anchor="end">50%</text>
<line x1="56" x2="570" y1="151.5" y2="151.5" class="grid" stroke-width="1"/>
<text x="48.0" y="155.5" class="tm" font-size="11" text-anchor="end">75%</text>
<line x1="56" x2="570" y1="92.0" y2="92.0" class="grid" stroke-width="1"/>
<text x="48.0" y="96.0" class="tm" font-size="11" text-anchor="end">100%</text>
<text x="56.0" y="348.0" class="tm" font-size="11" text-anchor="middle">0</text>
