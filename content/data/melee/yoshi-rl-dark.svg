<text x="467.2" y="348.0" class="tm" font-size="11" text-anchor="middle">800</text>
<text x="570.0" y="348.0" class="tm" font-size="11" text-anchor="middle">1,000</text>
<text x="570.0" y="366.0" class="tm" font-size="11" text-anchor="end">RL steps (1,000 ≈ 25 hours on one RTX 3090)</text>
