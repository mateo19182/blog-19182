<text x="584.0" y="90.0" class="t1" font-size="12" text-anchor="start" font-weight="600">Step 1000, no delay</text>
<text x="584.0" y="106.0" class="t2" font-size="11.5" text-anchor="start">48 of 48 vs the Fox</text>
<text x="584.0" y="122.0" class="t2" font-size="11.5" text-anchor="start">85 of 88 in real Dolphin</text>
<text x="584.0" y="304.0" class="t1" font-size="12" text-anchor="start" font-weight="600">Same bot, 1 frame</text>
<text x="584.0" y="320.0" class="t1" font-size="12" text-anchor="start" font-weight="600">of input delay:</text>
<text x="584.0" y="336.0" class="t2" font-size="11.5" text-anchor="start">0 of 48 vs the Fox</text>
