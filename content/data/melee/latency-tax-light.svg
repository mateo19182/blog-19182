<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" role="img" aria-label="The latency tax: same model, untimed vs real time">
<title>The latency tax: same model, untimed vs real time</title>
<style>text{font-family:Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif;font-variant-numeric:tabular-nums}.bg{fill:None}.ring{stroke:#e9e7e1}.t1{fill:#2b2926}.t2{fill:#4a4640}.tm{fill:#7d786e}.grid{stroke:#d8d5cd}.axis{stroke:#a8a398}.band{fill:#6a655c;fill-opacity:.12}.conn{stroke:#bdb8ad}.c-learned{fill:#2a78d6;stroke:#2a78d6}.c-coach{fill:#eb6834;stroke:#eb6834}.c-written{fill:#1baf7a;stroke:#1baf7a}.c-llm{fill:#eda100;stroke:#eda100}.c-jev{fill:#e87ba4;stroke:#e87ba4}.c-ref{fill:#8a8579;stroke:#8a8579}.ci{fill:none;stroke-width:2;stroke-linecap:round}.hollow{fill-opacity:0}</style>
<text x="16.0" y="26.0" class="t1" font-size="15" text-anchor="start" font-weight="600">The latency tax: same model, untimed vs real time</text>
<text x="16.0" y="45.0" class="t2" font-size="12" text-anchor="start">Untimed: the game waits for every decision. Real time: 60 fps, never waits. 95% intervals are about ±125-190.</text>
