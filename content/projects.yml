- title: "music-stack"
  url: "https://github.com/mateo19182/music-stack"
  date: "2026-10"
  desc: >-
    My self-hosted music setup. An acquisition app searches Soulseek and yt-dlp, prepares tagged copies with Beets, FFmpeg and Essentia, and holds them for manual review, with LLM metadata advice, before they reach Navidrome. Includes MCP tools so an agent can search and queue music from Telegram, but never approve it.
  desc_es: >-
    Mi montaje de música autoalojado. Una app de adquisición busca en Soulseek y yt-dlp, prepara copias etiquetadas con Beets, FFmpeg y Essentia y las retiene para revisión manual, con consejos de metadatos de un LLM, antes de pasar a Navidrome. Incluye herramientas MCP para que un agente busque y encole música desde Telegram, pero nunca la apruebe.

- title: "trace-it"
  url: "https://github.com/Martinhdeez/trace-it"
  date: "2026-09"
  desc: >-
    Winner of the [HackSpain](https://hackspain.com/) Maisa track. Turns operating policy described in plain language into versioned, deterministic decision processes. Ingests documents in any format, proposes the rules and data sources, compiles them to tested Python, and backtests against past cases before publishing... Built with a team of five.
  desc_es: >-
    Ganador de [HackSpain](https://hackspain.com/), track de Maisa. Convierte procesos descritos en lenguaje natural en pipelines automáticos: ingiere documentos en cualquier formato, propone reglas y fuentes de datos, compila a Python determinista, hace backtesting... Hecho con un equipo de cinco personas.

