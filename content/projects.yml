- title: "Full Marks"
  url: "https://github.com/mateo19182/full-marks"
  date: "2026-10"
  tags: [ml, research, art-music]
  desc: >-
    Experiments in getting an audio-aesthetics predictor (Audiobox Aesthetics) to give top scores to unusual sounds, by optimising waveforms, codec latents and the initial noise of a frozen generator. The scores can be pushed past the human 1–10 scale, but they collapse with small gain changes or off-grid time shifts, and a high predicted score doesn't make the audio more enjoyable.
  desc_es: >-
    Experimentos para que un predictor de estética de audio (Audiobox Aesthetics) dé la máxima nota a sonidos poco habituales, optimizando formas de onda, latentes de un códec y el ruido inicial de un generador congelado. Las puntuaciones se pueden llevar por encima de la escala humana de 1 a 10, pero se hunden con pequeños cambios de ganancia o desplazamientos fuera de la rejilla temporal, y una nota alta no hace que el audio guste más.

- title: "posthumail"
  url: "https://github.com/mateo19182/posthumail"
  date: "2026-10"
  tags: [self-hosted, tools]
  desc: >-
    A self-hosted dead man's switch on Cloudflare's free plan. Monthly check-ins by email and Telegram; if I stop answering, trusted people are asked, and once enough of them confirm, my messages are sent. It also emails the blog's life updates to the newsletter list.
  desc_es: >-
    Un interruptor de hombre muerto autoalojado en el plan gratuito de Cloudflare. Comprobaciones mensuales por correo y Telegram; si dejo de responder, se pregunta a personas de confianza y, cuando suficientes confirman, se envían mis mensajes. También manda por correo las actualizaciones del blog a la lista del boletín.

- title: "trace-it"
  url: "https://github.com/Martinhdeez/trace-it"
  date: "2026-09"
  tags: [llm, competitions]
  highlight: true
  desc: >-
    Winner of the [HackSpain](https://hackspain.com/) Maisa track. Turns operating policy described in plain language into versioned, deterministic decision processes. Ingests documents in any format, proposes the rules and data sources, compiles them to tested Python, and backtests against past cases before publishing... Built with a team of five.
  desc_es: >-
    Ganador de [HackSpain](https://hackspain.com/), track de Maisa. Convierte procesos descritos en lenguaje natural en pipelines automáticos: ingiere documentos en cualquier formato, propone reglas y fuentes de datos, compila a Python determinista, hace backtesting... Hecho con un equipo de cinco personas.

- title: "Data centres in Spain"
  title_es: "Centros de datos en España"
  url: "https://datacenters.m19182.dev"
  date: "2026-08"
  tags: [public-data, research]
  highlight: true
  image: datacenters.webp
  desc: >-
    A public, source-backed map of data centres in peninsular Spain and their relationship to the electricity transmission grid. It keeps IT load, grid connection capacity, and installed power separate, and leaves gaps and contradictions visible. The project attracted interest from a data-centre consulting company. [code and data](https://github.com/mateo19182/mapa-datacenters-espana).
  desc_es: >-
    Un mapa público y con fuentes de los centros de datos de la España peninsular y su relación con la red de transporte eléctrico. Separa la carga IT, la capacidad de conexión a la red y la potencia instalada, y deja a la vista los huecos y las contradicciones. El proyecto despertó el interés de una consultora especializada en centros de datos. [código y datos](https://github.com/mateo19182/mapa-datacenters-espana).

