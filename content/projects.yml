- title: "El reto de Feijoo"
  url: "/writings/El-reto-de-Feijoo"
  date: "2026-10"
  desc: >-
    In 1729 and 1733 Feijoo dared his readers to find even four lines in his books translated from French journals. Using OCR and cross-language search, I found ten solid cases and two borderline ones, six of which I couldn't find identified in earlier scholarship. The [write-up](/writings/El-reto-de-Feijoo) is on the blog (in Spanish); [materials](/data/feijoo-evidence/index.html) and [code and data](https://github.com/mateo19182/feijoo).
  desc_es: >-
    En 1729 y 1733 Feijoo retó a sus lectores a encontrar siquiera cuatro líneas traducidas de revistas francesas en sus libros. Con OCR y búsqueda entre idiomas encontré diez casos sólidos y dos fronterizos; para seis no encontré una identificación anterior en la bibliografía. El [artículo](/writings/El-reto-de-Feijoo) está en el blog; [materiales](/data/feijoo-evidence/index.html) y [código y datos](https://github.com/mateo19182/feijoo).

