- title: "forocoches-lm"
  title_es: "forocoches-lm"
  url: "https://forocoches.m19182.dev"
  date: "2026-10"
  tags: [llm, ml, public-data]
  highlight: true
  image: forocoches.webp
  desc: >-
    A 1B language model that writes ForoCoches threads: title, opening post and replies, in the forum's Spanish, conditioned on a thread type. Gemma 3 fully fine-tuned on half a million archived threads, served as a forum look-alike where generation runs in your browser over WebGPU. Model, browser weights and the labelled dataset are on [Hugging Face](https://huggingface.co/mateo-19182); [code](https://github.com/mateo19182/forocoches-lm).
  desc_es: >-
    Un modelo de lenguaje de 1B que escribe hilos de ForoCoches: título, OP y respuestas, en el castellano del foro y según el tipo de hilo que le pidas. Gemma 3 con full fine-tune sobre medio millón de hilos del archivo, servido como una réplica del foro donde la generación corre en tu navegador con WebGPU. El modelo, los pesos para navegador y el dataset etiquetado están en [Hugging Face](https://huggingface.co/mateo-19182); [código](https://github.com/mateo19182/forocoches-lm).

- title: "Spanish Politics on Telegram"
  title_es: "Política española en Telegram"
  url: "https://canales.m19182.dev"
  date: "2026-10"
  tags: [public-data, research]
  highlight: true
  image: telegram.webp
  desc: >-
    A searchable archive of public Telegram channels relevant to Spanish politics. Browse messages and channel statistics, trace forwarding sources, and explore similar posts grouped into weekly stories. The channel selection draws on published disinformation research and includes parties, media and civil-society organisations. [code](https://github.com/mateo19182/tg-monitor).
  desc_es: >-
    Un archivo con buscador de canales públicos de Telegram relacionados con la política española. Permite consultar mensajes y estadísticas, rastrear el origen de los reenvíos y explorar publicaciones similares agrupadas en historias semanales. La selección parte de investigaciones publicadas sobre desinformación e incluye partidos, medios y organizaciones de la sociedad civil. [código](https://github.com/mateo19182/tg-monitor).

- title: "A Coruña street-image archive"
  title_es: "Archivo de imágenes urbanas de A Coruña"
  url: "https://typology.m19182.dev"
  date: "2026-10"
  tags: [public-data, ml]
  highlight: true
  image: typology.webp
  desc: >-
    An experiment in cataloguing A Coruña through street-level imagery from Apple, Google and Mapillary. Detects and crops shop signs, graffiti, street-name plates and other objects into a browsable map and photo grids inspired by the Bechers' typologies. Includes text search, capture-date filters and multiple viewpoints. [code](https://github.com/mateo19182/typology-machine).
  desc_es: >-
    Un experimento para catalogar A Coruña a partir de imágenes de calle de Apple, Google y Mapillary. Detecta y recorta rótulos de comercios, grafitis, placas de calles y otros objetos para explorarlos en un mapa y en cuadrículas de fotos inspiradas en las tipologías de los Becher. Incluye búsqueda de texto, filtros por fecha de captura y varias vistas. [código](https://github.com/mateo19182/typology-machine).

- title: "El reto de Feijoo"
  url: "/writings/El-reto-de-Feijoo"
  date: "2026-10"
  tags: [research]
  highlight: true
  image: feijoo.webp
  desc: >-
    In 1729 and 1733 Feijoo dared his readers to find even four lines in his books translated from French journals. Using OCR and cross-language search, I found ten solid cases and two borderline ones, six of which I couldn't find identified in earlier scholarship. The [write-up](/writings/El-reto-de-Feijoo) is on the blog (in Spanish); [materials](/data/feijoo-evidence/index.html) and [code and data](https://github.com/mateo19182/feijoo).
  desc_es: >-
    En 1729 y 1733 Feijoo retó a sus lectores a encontrar siquiera cuatro líneas traducidas de revistas francesas en sus libros. Con OCR y búsqueda entre idiomas encontré diez casos sólidos y dos fronterizos; para seis no encontré una identificación anterior en la bibliografía. El [artículo](/writings/El-reto-de-Feijoo) está en el blog; [materiales](/data/feijoo-evidence/index.html) y [código y datos](https://github.com/mateo19182/feijoo).

